<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#16213a"/>
      <stop offset="55%" stop-color="#0f1420"/>
      <stop offset="100%" stop-color="#0a0d16"/>
    </linearGradient>
    <radialGradient id="discRed" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ff8a93"/>
      <stop offset="45%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#c81e2e"/>
    </radialGradient>
    <radialGradient id="discYellow" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fff2b0"/>
      <stop offset="45%" stop-color="#ffd23f"/>
      <stop offset="100%" stop-color="#e0a300"/>
    </radialGradient>
    <linearGradient id="boardFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <pattern id="holes" width="31.43" height="31.67" patternUnits="userSpaceOnUse" patternTransform="translate(540 610)">
      <circle cx="15.71" cy="15.83" r="10.69" fill="rgba(8,12,22,0.5)"/>
    </pattern>
    <filter id="blurL" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="blurBoard" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <rect width="800" height="1400" fill="url(#bg)"/>

  <circle cx="80" cy="1050" r="130" fill="url(#discRed)" opacity="0.2" filter="url(#blurL)"/><circle cx="620" cy="1200" r="150" fill="url(#discYellow)" opacity="0.16" filter="url(#blurL)"/><circle cx="150" cy="250" r="90" fill="url(#discYellow)" opacity="0.14" filter="url(#blurL)"/>

  
  <g transform="rotate(10 650.0 705.0)" opacity="0.32" filter="url(#blurBoard)">
    <rect x="540" y="610" width="220" height="190" rx="24" fill="url(#boardFace)" />
    <rect x="540" y="610" width="220" height="190" rx="24" fill="url(#holes)" />
    <circle cx="555.7" cy="784.2" r="11.9" fill="url(#discRed)" stroke="rgba(0,0,0,0.25)" stroke-width="1"/><circle cx="587.1" cy="784.2" r="11.9" fill="url(#discRed)" stroke="rgba(0,0,0,0.25)" stroke-width="1"/><circle cx="650.0" cy="784.2" r="11.9" fill="url(#discRed)" stroke="rgba(0,0,0,0.25)" stroke-width="1"/><circle cx="587.1" cy="752.5" r="11.9" fill="url(#discRed)" stroke="rgba(0,0,0,0.25)" stroke-width="1"/><circle cx="618.6" cy="720.8" r="11.9" fill="url(#discRed)" stroke="rgba(0,0,0,0.25)" stroke-width="1"/><circle cx="650.0" cy="689.2" r="11.9" fill="url(#discRed)" stroke="rgba(0,0,0,0.25)" stroke-width="1"/><circle cx="681.4" cy="784.2" r="11.9" fill="url(#discYellow)" stroke="rgba(0,0,0,0.25)" stroke-width="1"/><circle cx="681.4" cy="752.5" r="11.9" fill="url(#discYellow)" stroke="rgba(0,0,0,0.25)" stroke-width="1"/><circle cx="555.7" cy="752.5" r="11.9" fill="url(#discYellow)" stroke="rgba(0,0,0,0.25)" stroke-width="1"/><circle cx="744.3" cy="784.2" r="11.9" fill="url(#discYellow)" stroke="rgba(0,0,0,0.25)" stroke-width="1"/><circle cx="744.3" cy="752.5" r="11.9" fill="url(#discYellow)" stroke="rgba(0,0,0,0.25)" stroke-width="1"/><circle cx="618.6" cy="784.2" r="11.9" fill="url(#discYellow)" stroke="rgba(0,0,0,0.25)" stroke-width="1"/>
  </g>

</svg>